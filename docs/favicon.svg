<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="vendra-edge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="edge-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Transparent Background, Sharp Edge Monogram V + Supplier Shield Grid -->
  <g filter="url(#edge-glow)">
    <!-- Main Neon V Monogram Path -->
    <path d="M 20 24 L 60 100 L 100 24 L 80 24 L 60 74 L 40 24 Z" 
          fill="none" 
          stroke="url(#vendra-edge-grad)" 
          stroke-width="10" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    
    <!-- Supplier Node Dots -->
    <circle cx="20" cy="24" r="6" fill="#06b6d4" />
    <circle cx="60" cy="100" r="7" fill="#8b5cf6" />
    <circle cx="100" cy="24" r="6" fill="#10b981" />
    
    <!-- Center Shield Pulse Arc -->
    <path d="M 44 44 C 54 36, 66 36, 76 44" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
